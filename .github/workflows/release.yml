name: release

# Pushing a tag such as v0.1.0 builds the package, checks that the tag matches the version in the
# code, and publishes to PyPI with trusted publishing (no API token is stored anywhere).
# One-time setup on PyPI: add a trusted publisher for owner Am1n1602, repository calcfinc,
# workflow release.yml, environment pypi. Run this workflow by hand (workflow_dispatch) to
# publish to TestPyPI first, with a trusted publisher set up there for environment testpypi.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine -e .[dev]
      - run: ruff check . && mypy && pytest -q
      - name: The tag must match the version in the code
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import calcfinc; print(calcfinc.__version__)")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $version"; exit 1; }
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
