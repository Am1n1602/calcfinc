[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "calcfinc"
dynamic = ["version"]
description = "Auditable financial metrics from periodic statements of any entity: every result carries its formula, input facts and limitations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Am1n1602 (Aman Gautam)" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["finance", "financial-statements", "financial-ratios", "xbrl", "sec", "audit", "provenance", "decimal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Am1n1602/calcfinc"
Documentation = "https://github.com/Am1n1602/calcfinc/blob/main/docs/manual.md"
Source = "https://github.com/Am1n1602/calcfinc"
Issues = "https://github.com/Am1n1602/calcfinc/issues"
Changelog = "https://github.com/Am1n1602/calcfinc/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pandas = ["pandas>=2"]   # only needed to load DataFrames; the loader itself never imports pandas
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pandas>=2", "coverage>=7"]

[tool.hatch.version]
path = "src/calcfinc/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/calcfinc"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/docs", "/scripts", "/README.md", "/LICENSE", "/CHANGELOG.md",
           "/SECURITY.md", "/CONTRIBUTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/calcfinc"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.11"
